<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 40px;">
<h3 style="color: #059669;">Payment Completed!</h3>
<p style="font-size: 13px; color: #475569;">Updating your wallet balance...</p>
<script>
    // Notify parent application window
    if (window.opener) {
        window.opener.postMessage("PAYMENT_SUCCESS", "*");
    }
    setTimeout(() => {
        window.close();
    }, 800);
</script>
</body>
</html>
